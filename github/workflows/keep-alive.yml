name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */6 * * *'   # esegue ogni 6 ore, tutti i giorni
  workflow_dispatch:         # permette anche di avviarlo manualmente da GitHub

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa Playwright (il browser automatico)
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visita l'app per tenerla sveglia
        run: python wake_app.py
